<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PACIFIX - Store</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <a href="index.html" class="logo-container">
            <img src="logo.png" alt="PACIFIX Logo" class="brand-logo" onerror="this.style.display='none'" />
            <span class="logo-text">PACIFIX</span>
        </a>

        <div class="search-container">
            <i data-lucide="search" class="search-icon"></i>
            <input type="text" id="search-input" placeholder="Search Pacifix..." />
        </div>

        <div class="nav-actions">
            <button class="pill-btn currency-btn" id="currency-toggle">
                <span id="currency-label">USD</span> <i data-lucide="chevron-down"></i>
            </button>
            <button class="icon-btn" id="theme-toggle" aria-label="Toggle Theme">
                <i data-lucide="sun"></i>
            </button>
            <button class="icon-btn" id="cart-btn" aria-label="Open Cart">
                <i data-lucide="shopping-cart"></i>
                <span class="cart-badge" id="cart-badge">0</span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        <div class="page-header">
            <div>
                <h1 class="page-title">Shop the collection</h1>
                <p class="page-subtitle">Fresh picks fetched direct from database.</p>
            </div>
            <div class="product-count" id="product-count">Loading...</div>
        </div>

        <div class="content-layout">
            <!-- Sidebar Categories -->
            <aside class="sidebar">
                <button class="category-btn active" data-category="all">All</button>
                <button class="category-btn" data-category="tech">Tech</button>
                <button class="category-btn" data-category="gadgets">Cool Gadgets</button>
            </aside>

            <!-- Products Grid (No direct Add to Cart buttons on cards) -->
            <section class="product-grid" id="product-grid">
                <p class="loading-state">Fetching products from database...</p>
            </section>
        </div>
    </main>

    <div class="overlay" id="overlay"></div>

    <!-- Cart Drawer -->
    <aside class="cart-drawer" id="cart-drawer">
        <div class="cart-header">
            <h2>Your Cart</h2>
            <button class="icon-btn close-cart" id="close-cart"><i data-lucide="x"></i></button>
        </div>

        <div class="cart-body" id="cart-body">
            <div class="empty-cart" id="empty-cart">
                <div class="cart-icon-wrapper"><i data-lucide="shopping-cart"></i></div>
                <p class="empty-title">Your cart is empty</p>
                <button class="primary-btn" id="continue-shopping">Continue Shopping</button>
            </div>

            <div class="cart-content-wrapper" id="cart-content-wrapper" style="display: none;">
                <div class="cart-items" id="cart-items"></div>
                <div class="cart-footer">
                    <button class="buy-now-btn" id="buy-now-btn">Checkout</button>
                </div>
            </div>
        </div>
    </aside>

    <script src="js/script.js"></script>
</body>
</html>
