<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Details - Pacifix</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" href="favicon.ico" />
</head>
<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <a href="index.html" class="logo-container">
            <img src="logo.png" alt="PACIFIX Logo" class="brand-logo" onerror="this.style.display='none'" />
            <span class="logo-text">PACIFIX</span>
        </a>

        <div class="search-container">
            <i data-lucide="search" class="search-icon"></i>
            <input type="text" id="search-input" placeholder="Search Pacifix..." />
        </div>

        <div class="nav-actions">
            <button class="pill-btn currency-btn" id="currency-toggle">
                <span id="currency-label">USD</span> <i data-lucide="chevron-down"></i>
            </button>
            <button class="icon-btn" id="theme-toggle" aria-label="Toggle Theme">
                <i data-lucide="sun"></i>
            </button>
            <button class="icon-btn" id="cart-icon-btn" aria-label="Open Cart">
                <i data-lucide="shopping-cart"></i>
                <span class="cart-badge" id="cart-badge">0</span>
            </button>
        </div>
    </header>

    <!-- Main Dynamic Container -->
    <main class="container" id="product-detail-container">
        <!-- script.js dynamically injects the entire product detail layout here -->
        <div class="loading-state" style="text-align: center; padding: 4rem 0;">
            <p>Loading product details...</p>
        </div>
    </main>

    <!-- Cart Overlay & Drawer -->
    <div class="overlay" id="drawer-overlay"></div>

    <aside class="cart-drawer" id="cart-drawer">
        <div class="cart-header">
            <h2>Your Cart</h2>
            <button class="icon-btn close-cart" id="close-drawer-btn"><i data-lucide="x"></i></button>
        </div>

        <div class="cart-body" id="cart-body">
            <div class="empty-cart" id="empty-cart">
                <div class="cart-icon-wrapper"><i data-lucide="shopping-cart"></i></div>
                <p class="empty-title">Your cart is empty</p>
                <button class="primary-btn" id="continue-shopping">Continue Shopping</button>
            </div>

            <div class="cart-content-wrapper" id="cart-content-wrapper" style="display: none;">
                <div class="cart-items" id="cart-items-container"></div>
                <div class="cart-footer">
                    <div class="cart-total" style="display: flex; justify-content: space-between; margin-bottom: 1rem; font-weight: bold; font-size: 1.1rem;">
                        <span>Total:</span>
                        <span id="cart-total-price">$0.00</span>
                    </div>
                    <button class="buy-now-btn" id="buy-now-btn">Checkout</button>
                </div>
            </div>
        </div>
    </aside>

    <script src="js/script.js"></script>
</body>
</html>
